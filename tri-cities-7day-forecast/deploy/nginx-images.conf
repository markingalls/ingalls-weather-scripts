# nginx site config for images.ingallswx.com
#
# Serves a folder of static, script-generated images as plain URLs (no PHP,
# no WordPress involved). Install to /etc/nginx/sites-available/images and
# symlink into sites-enabled -- see DEPLOY.md Phase 3.
#
# Certbot will edit this file in place during Phase 5 to add the 443/SSL
# server block and an HTTP->HTTPS redirect. Don't hand-add SSL directives
# before running certbot; let it do that part.

server {
    listen 80;
    listen [::]:80;
    server_name images.ingallswx.com;

    root /var/www/images;
    autoindex off;

    # The forecast PNG is overwritten in place under the same name every
    # run, and there's no cache-busting query string, so browsers need to
    # re-check on every load rather than trust a cached copy for a while.
    # "no-cache" (not "no-store") still lets the browser keep a cached copy,
    # but forces it to revalidate with the server first every time -- nginx
    # handles that automatically via Last-Modified/ETag on static files, so
    # an unchanged image round-trips as a tiny 304 instead of a full
    # re-download. Net effect: always current on a normal reload, no hard
    # refresh needed, without meaningfully more load on the server.
    location = /tricities_forecast.png {
        add_header Cache-Control "no-cache";
    }

    # Fallback for any other file dropped into the folder later.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
