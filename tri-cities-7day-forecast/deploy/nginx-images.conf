# nginx site config for images.ingallswx.com
#
# Serves a folder of static, script-generated images as plain URLs (no PHP,
# no WordPress involved). Install to /etc/nginx/sites-available/images and
# symlink into sites-enabled -- see DEPLOY.md Phase 3.
#
# Certbot will edit this file in place during Phase 5 to add the 443/SSL
# server block and an HTTP->HTTPS redirect. Don't hand-add SSL directives
# before running certbot; let it do that part.

server {
    listen 80;
    listen [::]:80;
    server_name images.ingallswx.com;

    root /var/www/images;
    autoindex off;

    # Short cache lifetime on the forecast PNG: the file is overwritten in
    # place under the same name every run, so browsers and Jetpack's image
    # CDN need to re-check often (every 5 min) rather than caching it for
    # a long time -- there's no cache-busting query string in play.
    location = /tricities_forecast.png {
        add_header Cache-Control "public, max-age=300";
    }

    # Fallback for any other file dropped into the folder later.
    location / {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }
}
