# nginx site config for images.ingallswx.com
#
# Serves a folder of static, script-generated images as plain URLs (no PHP,
# no WordPress involved). Install to /etc/nginx/sites-available/images and
# symlink into sites-enabled -- see DEPLOY.md Phase 3.
#
# Certbot will edit this file in place during Phase 5 to add the 443/SSL
# server block and an HTTP->HTTPS redirect. Don't hand-add SSL directives
# before running certbot; let it do that part.

server {
    listen 80;
    listen [::]:80;
    server_name images.ingallswx.com;

    root /var/www/images;
    autoindex off;

    # Dedicated per-site access log (rather than falling into nginx's
    # shared default log) -- image-hit-stats/ parses this to build the hit
    # count dashboard. See its README for the aggregation/rotation-safe
    # reading approach; this directive is the only nginx-side change it
    # needs beyond the /stats location below.
    access_log /var/log/nginx/images-access.log;

    # Hit-count dashboard (image-hit-stats/deploy/update_stats.py renders
    # it here) -- deliberately kept out of search engines: robots.txt
    # (served from this same root) disallows /stats/, and this response
    # header is a second, independent layer that holds even if something
    # links to it directly and a crawler never reads robots.txt at all.
    location /stats/ {
        add_header X-Robots-Tag "noindex, nofollow";
        try_files $uri $uri/ =404;
    }

    # Each forecast/outlook PNG is overwritten in place under the same
    # name every run, with no cache-busting query string, so any cache
    # sitting in front of the viewer needs to re-check reasonably often
    # rather than trust a copy indefinitely. A bare "no-cache" (no
    # max-age) works perfectly for browsers hitting this origin directly
    # -- they do a real conditional GET (Last-Modified/ETag, which nginx
    # handles automatically) on every load, so an unchanged image
    # round-trips as a tiny 304. It does NOT work the same way for a CDN
    # sitting in between, though: WordPress.com's Jetpack rewrites these
    # image URLs through its Photon/Image CDN proxy (i0.wp.com) for every
    # page that embeds them, and Photon doesn't revalidate with origin on
    # every viewer request the way a browser does -- confirmed live: it
    # kept serving a copy from partway through a ~30h cron outage for
    # hours after the origin was already fixed and serving fresh images
    # with correct Last-Modified/ETag headers. An explicit short max-age
    # gives Photon (and any similar CDN) an unambiguous, bounded TTL to
    # respect instead of falling back to its own longer default when it
    # sees bare "no-cache" -- self-healing, no manual purge or cache-
    # busting query string needed on the WordPress side. 60s is short
    # enough that a real update is never more than a minute from showing
    # up anywhere, and cheap enough for nginx that it's not worth tuning
    # further. Applies to any file dropped into this folder, not just the
    # forecast images, so nothing further to add per-file.
    location / {
        add_header Cache-Control "no-cache, max-age=60";
        try_files $uri =404;
    }
}
